[workspace]
name = "cyp-challenge"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
polars = ">=1,<2"
pyarrow = ">=20,<30"
numpy = ">=2,<3"
scipy = ">=1.15,<2"
scikit-learn = ">=1.7,<2"
rdkit = ">=2025,<2027"
postgresql = ">=18,<19"
rdkit-postgresql = ">=2025,<2027"
psycopg = ">=3,<4"
lightgbm = ">=4,<5"
xgboost = ">=3,<4"
catboost = ">=1.2,<2"
optuna = ">=4,<5"
matplotlib = ">=3.10,<4"
plotly = ">=6,<7"
pyyaml = ">=6,<7"
httpx = ">=0.28,<1"
huggingface_hub = ">=0.30,<2"
gradio-client = ">=1,<3"
rich = ">=13,<15"
pytest = ">=8,<10"
ruff = ">=0.11,<1"
beautifulsoup4 = ">=4.15.0,<5"
markdownify = ">=1.2.3,<2"
chembl_structure_pipeline = ">=1.2.4,<2"
mordredcommunity = ">=2.0.7,<3"
umap-learn = ">=0.5.12,<0.6"
gemmi = ">=0.7.5,<0.8"

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"
HF_HOME = "$PIXI_PROJECT_ROOT/.cache/huggingface"
GRADIO_TEMP_DIR = "$PIXI_PROJECT_ROOT/.cache/gradio"
TMPDIR = "$PIXI_PROJECT_ROOT/.cache/tmp"

[tasks]
cyp = "python -m cyp_challenge"
db-init = "python -m cyp_challenge db init"
db-start = "python -m cyp_challenge db start"
db-stop = "python -m cyp_challenge db stop"
db-migrate = "python -m cyp_challenge db migrate"
db-backup = "python -m cyp_challenge db backup"
api-inspect = "python -m cyp_challenge api-inspect"
check = "ruff check ."
format = "ruff format ."
test = "pytest -q"

[pypi-dependencies]
torch = ">=2.7, <3"
chemprop = ">=2.2, <3"
tabpfn = ">=9, <10"
tabicl = ">=2, <3"
rustuna = ">=0.1.0, <0.2"
torch-geometric = ">=2.6, <3"
mace-torch = ">=0.3, <0.4"

[feature.jazzy.dependencies]
python = "3.11.*"
polars = ">=1,<2"

[feature.jazzy.pypi-dependencies]
jazzy = "==0.1.4"

[environments]
jazzy = { features = ["jazzy"], no-default-feature = true }
monroe = { features = ["monroe"] }
minimol = { features = ["minimol"], no-default-feature = true }

[feature.monroe.dependencies]
datamol = ">=0.12,<0.13"

[feature.monroe.pypi-dependencies]
monroe = { git = "https://github.com/blazejba/monroe", rev = "de075ea" }

[feature.minimol.dependencies]
python = "3.11.*"
graphium = "==2.4.7"
pytorch-cpu = "*"
scipy = "<1.13"
polars = ">=1,<2"

[feature.minimol.pypi-dependencies]
minimol = "==1.3.5"
